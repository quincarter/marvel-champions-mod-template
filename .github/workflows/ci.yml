# Checks the pack on every push and pull request, and on a v* tag builds it and attaches the zip and pack.json to a
# release. The mod store's registry rebuilds the pack from the tagged commit and compares it with that zip.
name: Pack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - run: npx --no-install mc-pack validate .
      - run: npx --no-install tsc --noEmit
      - run: npx --no-install mc-pack test .

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx --no-install mc-pack build . --out build
      - name: Check the tag matches pack.json's version
        run: |
          version=$(node -p "require('./build/pack.json').version")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but pack.json says $version"; exit 1; }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip build/pack.json --title "$GITHUB_REF_NAME" --generate-notes
